Categories:
  - Security
License: GPL-3.0-or-later
AuthorName: Sarvesh Pandit
SourceCode: https://github.com/SarveshP16/pinbox
IssueTracker: https://github.com/SarveshP16/pinbox/issues
Changelog: https://github.com/SarveshP16/pinbox/blob/HEAD/CHANGELOG.md

AutoName: Pinbox

RepoType: git
Repo: https://github.com/SarveshP16/pinbox.git

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: v1.0.0
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.47.2
    rm:
      - ios
    prebuild:
      - git -C $$flutter$$ checkout -f 3.47.2
      - $$flutter$$/bin/flutter config --no-analytics --no-cli-animations
    build:
      - $$flutter$$/bin/flutter pub get
      - $$flutter$$/bin/flutter build apk --release
    scanignore:
      - $$flutter$$/bin/cache
    scandelete:
      - $$flutter$$
      - .pub-cache

AutoUpdateMode: Version v%v
UpdateCheckMode: Tags
CurrentVersion: 1.0.0
CurrentVersionCode: 1
